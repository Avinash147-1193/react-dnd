# Continuous integration, generated by The Deployer.
# Builds and tests every service on each push. Deploys are handled by The
# Deployer's pipeline (push-to-deploy webhook / managed build).
name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-_digication_ws_hw_fs_fe_typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm run build --if-present
      - run: npm test --if-present
